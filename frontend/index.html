<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Disaster-Response Intelligence</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111111;
        background: #f6f6f6;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #f6f6f6;
      }

      .boot-shell {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 68px minmax(0, 1fr);
        color: #111111;
      }

      .boot-sidebar {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 16px;
        border-right: 1px solid #e5e5e5;
        background: #ffffff;
      }

      .boot-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 7px;
        color: #ffffff;
        background: #111111;
        font-size: 0.72rem;
        font-weight: 800;
      }

      .boot-main {
        display: grid;
        grid-template-rows: auto auto 1fr;
        gap: 12px;
        padding: 18px;
      }

      .boot-top,
      .boot-card,
      .boot-map,
      .boot-rail {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        background: #fafafa;
      }

      .boot-top {
        display: flex;
        min-height: 40px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-color: transparent;
        background: transparent;
      }

      .boot-title span,
      .boot-card span,
      .boot-rail span {
        color: #666666;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .boot-title h1 {
        margin: 8px 0 0;
        font-size: clamp(1.35rem, 2vw, 1.9rem);
        line-height: 1.12;
      }

      .boot-status {
        min-height: 32px;
        padding: 8px 10px;
        border: 1px solid #e5e5e5;
        border-radius: 7px;
        background: #ffffff;
        color: #222222;
        font-size: 0.72rem;
        font-weight: 800;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .boot-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .boot-card {
        min-height: 82px;
        padding: 16px;
      }

      .boot-card strong,
      .boot-rail strong {
        display: block;
        margin-top: 8px;
        font-size: 1rem;
      }

      .boot-grid {
        display: grid;
        min-height: 560px;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 12px;
      }

      .boot-map {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgba(17, 17, 17, 0.06) 1px, transparent 1px),
          linear-gradient(rgba(17, 17, 17, 0.06) 1px, transparent 1px),
          #f2f2f2;
        background-size: 54px 54px;
      }

      .boot-map::before,
      .boot-map::after {
        position: absolute;
        content: "";
        border: 1px solid #d7d7d7;
        border-radius: 999px;
      }

      .boot-map::before {
        inset: 28% 28% 18% 32%;
        background: rgba(255, 255, 255, 0.46);
      }

      .boot-map::after {
        inset: 40% 42% 34% 44%;
        border-color: #111111;
        background: #ffffff;
      }

      .boot-map-label {
        position: absolute;
        left: 16px;
        top: 16px;
        padding: 12px;
        border: 1px solid #e5e5e5;
        border-radius: 7px;
        background: #ffffff;
        font-weight: 800;
      }

      .boot-rail {
        padding: 18px;
      }

      .boot-line {
        height: 10px;
        margin-top: 16px;
        border-radius: 999px;
        background: #e5e5e5;
      }

      @media (max-width: 900px) {
        .boot-shell {
          grid-template-columns: 1fr;
        }

        .boot-sidebar {
          display: none;
        }

        .boot-main {
          padding: 14px;
        }

        .boot-top,
        .boot-cards,
        .boot-grid {
          grid-template-columns: 1fr;
        }

        .boot-top {
          align-items: flex-start;
          flex-direction: column;
        }

        .boot-cards {
          display: grid;
        }

        .boot-grid {
          min-height: 720px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-label="Loading dashboard">
        <aside class="boot-sidebar" aria-hidden="true">
          <div class="boot-mark">ML</div>
        </aside>
        <main class="boot-main">
          <div class="boot-top">
            <div class="boot-title">
              <span>Risk replay laboratory</span>
              <h1>NSW Bushfire Operations Console</h1>
            </div>
            <div class="boot-status">Loading replay</div>
          </div>
          <section class="boot-cards" aria-hidden="true">
            <div class="boot-card"><span>Training PR-AUC</span><strong>0.263</strong></div>
            <div class="boot-card"><span>Held-out PR-AUC</span><strong>0.523</strong></div>
            <div class="boot-card"><span>Source layers</span><strong>DEA + BoM + ABS</strong></div>
            <div class="boot-card"><span>Forecast mode</span><strong>24h horizon</strong></div>
          </section>
          <section class="boot-grid" aria-hidden="true">
            <div class="boot-map">
              <div class="boot-map-label">Loading map engine</div>
            </div>
            <div class="boot-rail">
              <span>Incident detail</span>
              <strong>South Coast Escarpment</strong>
              <div class="boot-line"></div>
              <div class="boot-line"></div>
              <div class="boot-line"></div>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
